name: Live-site watchdog

# Re-tests the deployed site after every deploy and every 6 hours.
# On failure it redeploys once (fixes stale caches / half-finished deploys) and
# opens a GitHub issue with the report; when the site is healthy again it closes
# that issue. Together with the deploy gate this keeps the site correcting itself.

on:
  workflow_run:
    workflows: ['Train model & deploy']
    types: [completed]
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: watchdog
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix tests --no-audit --no-fund

      - name: Wait for Pages to serve the latest build
        if: github.event_name == 'workflow_run'
        run: sleep 60

      - name: Test the live site
        id: live
        continue-on-error: true
        run: |
          set -o pipefail
          BASE="$SITE_URL" node tests/run.mjs 2>&1 | tee report.txt

      - name: Healthy → close any open watchdog issue
        if: steps.live.outcome == 'success'
        run: |
          for n in $(gh issue list --label watchdog --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Live site healthy again ($(date -u +%FT%TZ)). $(tail -1 report.txt)"
          done

      - name: Broken → redeploy once and file an issue
        if: steps.live.outcome == 'failure'
        run: |
          gh label create watchdog --color D93F0B --description "Automatic live-site checks" 2>/dev/null || true
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            gh workflow run deploy.yml && echo "redeploy triggered"
          fi
          BODY=$(printf 'The watchdog found problems on %s at %s.\n\n```\n%s\n```\n\nA redeploy was triggered automatically; this issue closes itself when checks pass again.' "$SITE_URL" "$(date -u +%FT%TZ)" "$(grep -E 'FAIL|checks passed' report.txt | head -40)")
          existing=$(gh issue list --label watchdog --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$BODY"; else gh issue create --title "Live site check failed" --label watchdog --body "$BODY"; fi
          exit 1
